<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="3840" y2="2160">
      <stop offset="0" stop-color="#131019"/>
      <stop offset="0.55" stop-color="#181322"/>
      <stop offset="1" stop-color="#1d1628"/>
    </linearGradient>
    <radialGradient id="haze1" gradientUnits="userSpaceOnUse" cx="1920" cy="1020" r="1500">
      <stop offset="0" stop-color="#c88ff0" stop-opacity="0.07"/>
      <stop offset="0.6" stop-color="#c88ff0" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#c88ff0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze2" gradientUnits="userSpaceOnUse" cx="1920" cy="1020" r="850">
      <stop offset="0" stop-color="#ff7fb8" stop-opacity="0.05"/>
