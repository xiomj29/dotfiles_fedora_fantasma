    <clipPath id="band1"><rect x="0" y="880"  width="3840" height="118"/></clipPath>
    <clipPath id="band2"><rect x="0" y="1218" width="3840" height="86"/></clipPath>
    <clipPath id="band3"><rect x="0" y="1368" width="3840" height="54"/></clipPath>
